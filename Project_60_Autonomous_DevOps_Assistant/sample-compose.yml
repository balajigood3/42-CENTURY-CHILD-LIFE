services:
  api:
    image: python:3.11-slim
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
